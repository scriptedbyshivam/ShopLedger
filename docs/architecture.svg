<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger, its Express routes, library modules, JSON data store, configuration, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52647a"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52647a}
      .head{font-size:16px;font-weight:700}.label{font-size:13px}.small{font-size:12px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:9}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:12}
      .ticket{fill:#fff2cc;stroke:#d97706;stroke-width:2;rx:9}
      .related{fill:#fff8e6;stroke:#d97706;stroke-width:1.7;rx:9}
      .arrow{fill:none;stroke:#52647a;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="30" y="39" class="title">ShopLedger · application architecture</text>
  <text x="30" y="62" class="subtitle">Browser POS, Express API, business logic, JSON persistence, and invoice rendering</text>

  <!-- Main architecture columns -->
  <rect x="25" y="88" width="190" height="433" class="group"/>
  <text x="42" y="117" class="head">Browser UI</text>
  <rect x="42" y="135" width="156" height="62" class="box"/>
  <text x="55" y="160" class="label" font-weight="700">public/</text>
  <text x="55" y="181" class="small">index.html · js/app.js · css</text>
  <text x="43" y="225" class="small">POS · orders · Khata</text>
  <text x="43" y="245" class="small">inventory · reports</text>
  <path d="M120 268 L120 300" class="flow"/>
  <circle cx="120" cy="283" r="13" fill="#2563eb"/><text x="116" y="288" font-size="13" fill="#fff" font-weight="700">1</text>
  <text x="43" y="326" class="small">POST /api/orders</text>
  <text x="43" y="347" class="small">GET /orders/:id/invoice</text>
  <text x="43" y="390" class="small">Displays response and</text>
  <text x="43" y="409" class="small">opens printable invoice</text>

  <rect x="245" y="88" width="182" height="433" class="group"/>
  <text x="263" y="117" class="head">HTTP server</text>
  <rect x="263" y="135" width="146" height="78" class="box"/>
  <text x="277" y="163" class="label" font-weight="700">server.js</text>
  <text x="277" y="184" class="small">Express + JSON parser</text>
  <text x="277" y="202" class="small">serves public/</text>
  <path d="M198 166 L263 166" class="arrow"/>
  <path d="M409 166 L463 166" class="arrow"/>
  <text x="263" y="256" class="small">Mounts each router at /api</text>
  <rect x="263" y="300" width="146" height="78" class="ticket"/>
  <text x="277" y="328" class="label" font-weight="700">Invoice page</text>
  <text x="277" y="350" class="small">/orders/:id/invoice</text>
  <text x="277" y="369" class="small">orders.get → invoice.render</text>
  <path d="M198 347 C220 347 230 339 263 339" class="arrow"/>

  <rect x="455" y="88" width="220" height="433" class="group"/>
  <text x="473" y="117" class="head">Routers · routes/</text>
  <rect x="473" y="135" width="184" height="66" class="box"/>
  <text x="488" y="161" class="label" font-weight="700">orders.js</text>
  <text x="488" y="183" class="small">list · get · create · cancel</text>
  <rect x="473" y="214" width="184" height="51" class="box"/>
  <text x="488" y="237" class="label" font-weight="700">products.js</text>
  <text x="488" y="255" class="small">products · coupons</text>
  <rect x="473" y="278" width="184" height="51" class="box"/>
  <text x="488" y="301" class="label" font-weight="700">customers.js</text>
  <text x="488" y="319" class="small">customers · settle</text>
  <rect x="473" y="342" width="184" height="64" class="box"/>
  <text x="488" y="366" class="label" font-weight="700">reports.js</text>
  <text x="488" y="386" class="small">dashboard · preview · GST</text>
  <text x="473" y="445" class="small">Also admin export endpoint</text>
  <path d="M675 169 L714 169" class="arrow"/>
  <path d="M675 300 L714 300" class="arrow"/>

  <rect x="705" y="88" width="270" height="433" class="group"/>
  <text x="723" y="117" class="head">Business logic · lib/</text>
  <rect x="723" y="135" width="108" height="52" class="box"/>
  <text x="735" y="157" class="label" font-weight="700">pricing.js</text><text x="735" y="176" class="small">computeTotals</text>
  <rect x="847" y="135" width="108" height="52" class="related"/>
  <text x="861" y="157" class="label" font-weight="700">tax.js</text><text x="861" y="176" class="small">HSN slabs</text>
  <path d="M831 160 L847 160" class="arrow"/>
  <rect x="723" y="199" width="108" height="52" class="box"/>
  <text x="735" y="221" class="label" font-weight="700">coupons.js</text><text x="735" y="240" class="small">validate / discount</text>
  <rect x="847" y="199" width="108" height="52" class="box"/>
  <text x="859" y="221" class="label" font-weight="700">inventory.js</text><text x="859" y="240" class="small">find / check / reserve</text>
  <rect x="723" y="263" width="108" height="52" class="box"/>
  <text x="735" y="285" class="label" font-weight="700">orders.js</text><text x="735" y="304" class="small">add / get / cancel</text>
  <rect x="847" y="263" width="108" height="52" class="box"/>
  <text x="859" y="285" class="label" font-weight="700">ledger.js</text><text x="859" y="304" class="small">Khata / settlements</text>
  <rect x="723" y="327" width="108" height="52" class="box"/>
  <text x="735" y="349" class="label" font-weight="700">store.js</text><text x="735" y="368" class="small">read / write / audit</text>
  <rect x="847" y="327" width="108" height="52" class="box"/>
  <text x="859" y="349" class="label" font-weight="700">reports.js</text><text x="859" y="368" class="small">summary / recon</text>
  <rect x="723" y="391" width="108" height="52" class="box"/>
  <text x="735" y="413" class="label" font-weight="700">dates.js</text><text x="735" y="432" class="small">today / filters</text>
  <rect x="847" y="391" width="108" height="68" class="ticket"/>
  <text x="859" y="415" class="label" font-weight="700">invoice.js</text><text x="859" y="435" class="small">compute + render</text><text x="859" y="452" class="small">printable HTML</text>
  <path d="M955 423 C987 423 982 333 1000 333" class="arrow"/>

  <rect x="995" y="88" width="180" height="433" class="group"/>
  <text x="1013" y="117" class="head">Settings &amp; data</text>
  <rect x="1013" y="145" width="144" height="102" class="box"/>
  <text x="1027" y="174" class="label" font-weight="700">config.js</text>
  <text x="1027" y="196" class="small">shop · GST slabs</text>
  <text x="1027" y="216" class="small">coupons · defaults</text>
  <path d="M1013 196 C986 196 984 159 955 159" class="arrow"/>
  <rect x="1013" y="300" width="144" height="93" class="box"/>
  <text x="1027" y="330" class="label" font-weight="700">data/db.json</text>
  <text x="1027" y="352" class="small">products · orders</text>
  <text x="1027" y="372" class="small">customers · audit</text>
  <path d="M955 352 L1013 352" class="arrow"/>
  <text x="1013" y="435" class="small">Local synchronous JSON</text>
  <text x="1013" y="454" class="small">persistence via store.js</text>

  <!-- Numbered order placement sequence -->
  <rect x="25" y="544" width="1150" height="218" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
  <text x="45" y="575" class="head">Order placement · numbered request path</text>
  <text x="45" y="599" class="small" fill="#52647a">Order create route: routes/orders.js · POST /orders</text>
  <g>
    <rect x="45" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="64" cy="639" r="13" fill="#2563eb"/><text x="60" y="644" font-size="13" fill="#fff" font-weight="700">1</text>
    <text x="84" y="644" class="label" font-weight="700">Browser submits</text><text x="57" y="669" class="small">items, customer,</text><text x="57" y="688" class="small">payment, coupon</text>
    <path d="M190 664 L211 664" class="flow"/>
    <rect x="215" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="234" cy="639" r="13" fill="#2563eb"/><text x="230" y="644" font-size="13" fill="#fff" font-weight="700">2</text>
    <text x="254" y="644" class="label" font-weight="700">Resolve + check</text><text x="227" y="669" class="small">store.read · inventory</text><text x="227" y="688" class="small">find / check stock</text>
    <path d="M360 664 L381 664" class="flow"/>
    <rect x="385" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="404" cy="639" r="13" fill="#2563eb"/><text x="400" y="644" font-size="13" fill="#fff" font-weight="700">3</text>
    <text x="424" y="644" class="label" font-weight="700">Price cart</text><text x="397" y="669" class="small">subtotal · coupon</text><text x="397" y="688" class="small">discount · GST · total</text>
    <path d="M530 664 L551 664" class="flow"/>
    <rect x="555" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="574" cy="639" r="13" fill="#2563eb"/><text x="570" y="644" font-size="13" fill="#fff" font-weight="700">4</text>
    <text x="594" y="644" class="label" font-weight="700">Khata if selected</text><text x="567" y="669" class="small">ledger.findCustomer</text><text x="567" y="688" class="small">chargeOrderToKhata</text>
    <path d="M700 664 L721 664" class="flow"/>
    <rect x="725" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="744" cy="639" r="13" fill="#2563eb"/><text x="740" y="644" font-size="13" fill="#fff" font-weight="700">5</text>
    <text x="764" y="644" class="label" font-weight="700">Commit order</text><text x="737" y="669" class="small">inventory.reserve</text><text x="737" y="688" class="small">orders.add</text>
    <path d="M870 664 L891 664" class="flow"/>
    <rect x="895" y="620" width="145" height="88" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
    <circle cx="914" cy="639" r="13" fill="#2563eb"/><text x="910" y="644" font-size="13" fill="#fff" font-weight="700">6</text>
    <text x="934" y="644" class="label" font-weight="700">Persist + reply</text><text x="907" y="669" class="small">appendAudit · write</text><text x="907" y="688" class="small">JSON saved · 201</text>
    <path d="M1040 664 L1061 664" class="flow"/>
    <rect x="1065" y="620" width="92" height="88" fill="#fff2cc" stroke="#d97706" stroke-width="1.7" rx="8"/>
    <text x="1080" y="645" class="label" font-weight="700">Invoice</text><text x="1076" y="670" class="small">separate</text><text x="1076" y="689" class="small">GET view</text>
  </g>
  <rect x="805" y="730" width="14" height="14" fill="#fff2cc" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="827" y="742" class="small">Ticket focus: invoice.js</text>
  <rect x="1000" y="730" width="14" height="14" fill="#fff8e6" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="1022" y="742" class="small">Related checkout tax: tax.js</text>
</svg>
